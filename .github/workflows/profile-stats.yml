name: Profile stats

# Builds the stats / streak / languages cards used in Readme.md and commits
# them to assets/, so the profile does not depend on third-party services.
on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch:
  push:
    branches: ["**"] # branches only, the commit step cannot push from a tag
    paths:
      - scripts/**
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Test generator
        run: python3 -m unittest discover -s scripts -v

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py --user "$GITHUB_REPOSITORY_OWNER" --out assets

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "Cards unchanged"
          else
            git commit -m "chore: update profile stats"
            git push
          fi
